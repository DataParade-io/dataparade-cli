# DATAP-672: score simulated A0 interviews against pinned DPKB fixtures.
#
# Fixtures are checked in under tests/eval/interview-a0/fixtures/dpkb/ (byte
# copies from DataParade-io/knowledge-base). No live GitHub API fetch; no
# GH_TOKEN or cross-repo secrets required.
#
# Source SHAs (see tests/eval/interview-a0/fixtures/brief.manifest.yaml):
#   brief: 16f2e857a47d54bfea6ca5d7f23a6c4f2732da29
#   skill/rubric: 8175d44a8483fed5bca73efdf1c13c24aee06f58

name: interview-a0 eval

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/interview-a0-eval.yml"
      - "tests/eval/interview-a0/**"
      - "tests/unit/eval/interview-a0-score.spec.ts"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/interview-a0-eval.yml"
      - "tests/eval/interview-a0/**"
      - "tests/unit/eval/interview-a0-score.spec.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  eval:
    name: eval:interview-a0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install

      - name: pnpm run eval:interview-a0
        run: pnpm run eval:interview-a0

      - name: Unit score rubric tests
        run: pnpm exec jest tests/unit/eval/interview-a0-score.spec.ts
