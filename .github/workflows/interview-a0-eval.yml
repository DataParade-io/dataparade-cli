# DATAP-672: score simulated A0 interviews against pinned knowledge-base brief.
#
# Required repository secret: GH_TOKEN
#   - Fine-grained PAT or GitHub App installation token
#   - Permission: contents:read on DataParade-io/knowledge-base (read-only)
#   - The default Actions GITHUB_TOKEN cannot read other private repos and is
#     intentionally not used when GH_TOKEN is absent (tests fail loudly).
#   - No vendored brief fallback — missing or insufficient GH_TOKEN must fail CI.
#
# Pinned SHAs (see tests/eval/interview-a0/fixtures/brief.manifest.yaml):
#   brief: 16f2e857a47d54bfea6ca5d7f23a6c4f2732da29
#   skill: 8175d44a8483fed5bca73efdf1c13c24aee06f58

name: interview-a0 eval

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/interview-a0-eval.yml"
      - "tests/eval/interview-a0/**"
      - "tests/unit/eval/interview-a0-score.spec.ts"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/interview-a0-eval.yml"
      - "tests/eval/interview-a0/**"
      - "tests/unit/eval/interview-a0-score.spec.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  eval:
    name: eval:interview-a0 (live KB fetch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Require GH_TOKEN for knowledge-base fetch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Missing GH_TOKEN secret::Add repository secret GH_TOKEN with contents:read on DataParade-io/knowledge-base. Interview-a0 eval fetches the pinned brief and skill at test time; there is no vendored brief fallback."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: pnpm run eval:interview-a0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm run eval:interview-a0

      - name: Unit score rubric tests
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm exec jest tests/unit/eval/interview-a0-score.spec.ts
