env_config:
  envVariable:
    patternId: env_variable
    regex: '\bSystem\.getenv\s*\(\s*"([^"]+)"'
    confidence: 0.85

  # Spring's property placeholders. @Value("${db.url}") and
  # Environment.getProperty("db.url") are the JVM equivalent of process.env:
  # they name a key without disclosing its value.
  propertyKeys:
    patternId: config_file
    confidence: 0.85
    regexes:
      - '@Value\s*\(\s*"\$\{([^:}"]+)'
      - '\bgetProperty\s*\(\s*"([^"]+)"'
      - '@ConfigurationProperties\s*\((?:\s*prefix\s*=\s*)?"([^"]+)"'
      - '@ConfigProperty\s*\(\s*name\s*=\s*"([^"]+)"'

  configLoaders:
    patternId: config_file
    confidence: 0.85
    loaders:
      - id: dotenv_java
        importPackages:
          - io.github.cdimascio.dotenv
        packageCoordinates:
          - io.github.cdimascio:dotenv-java
          - io.github.cdimascio:dotenv-kotlin
        callNames:
          - Dotenv.load
          - Dotenv.configure
      - id: typesafe_config
        importPackages:
          - com.typesafe.config
        packageCoordinates:
          - com.typesafe:config
        callNames:
          - ConfigFactory.load
          - ConfigFactory.parseFile
      - id: micronaut_context
        importPackages:
          - io.micronaut.context.annotation
        packageCoordinates:
          - io.micronaut:micronaut-context

  configFile:
    patternId: config_file
    fileNameRegex: '(^|/)[a-z0-9_]*config(uration)?\.(java|kt)$'
    name: jvm_config
    confidence: 0.75

