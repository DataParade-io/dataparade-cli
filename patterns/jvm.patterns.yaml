# JVM (Java + Kotlin) pattern config. All entries share: patternId, optional
# confidence (default 0.8).
#
# One config serves both languages: Java and Kotlin share the JVM package
# namespace, the Maven/Gradle coordinate space, the Spring/Jakarta annotation
# vocabulary, and JDBC. Rules that are genuinely Kotlin-only (Ktor, Exposed)
# are gated by their import package like any other framework.
#
# Two distinct token spaces, unlike Go:
#   `importPackages`     — what appears in an `import` statement
#                          (`org.springframework.web.bind.annotation`).
#                          Matched exactly or as a package prefix, so
#                          `org.springframework.data` also covers
#                          `org.springframework.data.jpa.repository`.
#   `packageCoordinates` — Maven/Gradle `groupId:artifactId` as written in
#                          `pom.xml` / `build.gradle`
#                          (`org.springframework.boot:spring-boot-starter-web`).
#                          Matched exactly, or by groupId prefix when the
#                          entry has no `:`.
# The two rarely coincide on the JVM, which is why both exist — the same
# split C++ needed for `packageNames` vs. header paths.

db_clients:
  # --- JDBC drivers -------------------------------------------------------
  # A driver on the classpath is strong evidence of the engine even when the
  # connection itself is opened through a pool or an ORM.
  - id: postgresql_jdbc
    patternId: database_connection
    databaseType: postgres
    importPackages:
      - org.postgresql
    packageCoordinates:
      - org.postgresql:postgresql
