routes:
  frameworks:
    # Spring MVC / WebFlux annotated controllers. The class-level
    # @RequestMapping supplies a prefix that the method-level mapping is
    # appended to, exactly like ASP.NET's [Route] + [HttpGet].
    - id: spring_mvc
      patternId: express_route
      importPackages:
        - org.springframework.web.bind.annotation
        - org.springframework.stereotype
      confidence: 0.9
      controllerAnnotations:
        - RestController
        - Controller
      controllerRouteAnnotations:
        - RequestMapping
      annotationRoutes:
        - annotation: GetMapping
          method: GET
        - annotation: PostMapping
          method: POST
        - annotation: PutMapping
          method: PUT
        - annotation: DeleteMapping
          method: DELETE
        - annotation: PatchMapping
          method: PATCH
        # Method-level @RequestMapping carries its verb in a named argument
        # (`method = RequestMethod.GET`); the detector reads it from the
        # annotation text and falls back to ANY.
        - annotation: RequestMapping
          method: ANY

    # Spring WebFlux functional routing: RouterFunctions.route().GET("/x", h).
    - id: spring_webflux_functional
      patternId: express_route
      importPackages:
        - org.springframework.web.reactive.function.server
      confidence: 0.85
      routeRegexes:
        - regex: '\.(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)\s*\(\s*"([^"]+)"'
          methodGroup: 1
          pathGroup: 2

    # JAX-RS (Jakarta REST): Jersey, RESTEasy, Quarkus. Unlike Spring, the
    # verb and the path are separate annotations — @GET plus @Path("/{id}") —
    # so `pathAnnotations` tells the detector where to read the sub-path from.
    - id: jaxrs
      patternId: express_route
      importPackages:
        - jakarta.ws.rs
        - javax.ws.rs
      confidence: 0.9
      controllerRouteAnnotations:
        - Path
      pathAnnotations:
        - Path
      annotationRoutes:
        - annotation: GET
          method: GET
        - annotation: POST
          method: POST
        - annotation: PUT
          method: PUT
        - annotation: DELETE
          method: DELETE
        - annotation: PATCH
          method: PATCH
        - annotation: HEAD
          method: HEAD
        - annotation: OPTIONS
          method: OPTIONS

    - id: micronaut
      patternId: express_route
      importPackages:
        - io.micronaut.http.annotation
      confidence: 0.9
      controllerAnnotations:
        - Controller
      controllerRouteAnnotations:
        - Controller
      annotationRoutes:
        - annotation: Get
          method: GET
        - annotation: Post
          method: POST
        - annotation: Put
          method: PUT
        - annotation: Delete
          method: DELETE
        - annotation: Patch
          method: PATCH
        - annotation: Head
          method: HEAD
        - annotation: Options
          method: OPTIONS

    # Ktor's routing DSL. The `(?:^|[^.\w])` guard keeps this off the Ktor
    # *client*, whose calls are receiver-qualified (`client.get("https://…")`)
    # while server routes are not (`get("/users") { … }`).
    - id: ktor
      patternId: express_route
      importPackages:
        - io.ktor.server.routing
        - io.ktor.server.application
        - io.ktor.routing
      confidence: 0.9
      routeRegexes:
        - regex: '(?:^|[^.\w])(get|post|put|delete|patch|head|options)\s*\(\s*"([^"]+)"'
          methodGroup: 1
          pathGroup: 2
        - regex: '(?:^|[^.\w])route\s*\(\s*"([^"]+)"'
          pathGroup: 1

    - id: javalin
      patternId: express_route
      importPackages:
        - io.javalin
      confidence: 0.9
      routeRegexes:
        - regex: '\b\w+\.(get|post|put|delete|patch|head|options)\s*\(\s*"([^"]+)"'
          methodGroup: 1
          pathGroup: 2

    - id: vertx_web
      patternId: express_route
      importPackages:
        - io.vertx.ext.web
      confidence: 0.85
      routeRegexes:
        - regex: '\b\w+\.(get|post|put|delete|patch|head|options)\s*\(\s*"([^"]+)"'
          methodGroup: 1
          pathGroup: 2
        - regex: '\brouter\.route\s*\(\s*"([^"]+)"'
          pathGroup: 1

    - id: spark_java
      patternId: express_route
      importPackages:
        - spark.Spark
        - spark.Service
      confidence: 0.85
      routeRegexes:
        - regex: '(?:^|[^.\w])(get|post|put|delete|patch|head|options)\s*\(\s*"([^"]+)"'
          methodGroup: 1
          pathGroup: 2

    - id: grpc_jvm
      patternId: express_route
      importPackages:
        - io.grpc
      confidence: 0.8
      routeRegexes:
        - regex: '\baddService\s*\(\s*new\s+([A-Za-z_]\w*)'
          pathGroup: 1
          defaultMethod: RPC
        - regex: '\bextends\s+([A-Za-z_]\w*)ImplBase\b'
          pathGroup: 1
          defaultMethod: RPC

