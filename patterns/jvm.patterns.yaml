# JVM-specific: JDBC is engine-agnostic at the API level, and the concrete
# engine is named in the URL sub-protocol — `jdbc:postgresql://host/db`. This
# is the JVM analogue of Go's `sql.Open` driver argument: without reading it,
# every JDBC database collapses into one generic SQL node.
#
# The same rule runs over `application.properties` / `application.yml` during
# manifest scanning, which is where Spring services usually declare the URL.
jdbc_url:
  patternId: database_connection
  regex: 'jdbc:([a-z0-9]+):'
  name: jdbc
  confidence: 0.9
  drivers:
    postgresql: postgres
    postgres: postgres
    mysql: mysql
    mariadb: mariadb
    sqlite: sqlite
    sqlserver: mssql
    jtds: mssql
    oracle: oracle
    h2: h2
    hsqldb: hsqldb
    db2: db2
    clickhouse: clickhouse
    snowflake: snowflake
    redshift: redshift
    presto: presto
    trino: trino
    # Not JDBC sub-protocols. Spring declares these engines as plain URIs
    # (`spring.data.mongodb.uri=mongodb://…`), and the manifest scanner
    # resolves them against this same table.
    mongodb: mongodb
    redis: redis
    rediss: redis
    cassandra: cassandra
    elasticsearch: elasticsearch
    opensearch: elasticsearch
    neo4j: neo4j
    bolt: neo4j
  defaultDatabaseType: sql

