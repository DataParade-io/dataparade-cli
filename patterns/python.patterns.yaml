# Python pattern config. All entries share: patternId, optional confidence (default 0.8).

db_clients:
  - id: psycopg2
    patternId: database_connection
    databaseType: postgres
    importModules:
      - psycopg2
      - psycopg
    callNames:
      - connect
    confidence: 0.9

  - id: sqlalchemy
    patternId: database_connection
    databaseType: sql
    importModules:
      - sqlalchemy
    callNames:
      - create_engine
    confidence: 0.9

  - id: django_orm
    patternId: database_connection
    databaseType: sql
    importModules:
      - django.db
    heuristics:
      usesObjectsAttribute: true
    confidence: 0.85

  - id: pymysql
    patternId: database_connection
    databaseType: mysql
    importModules:
      - pymysql
      - aiomysql
      - MySQLdb
    callNames:
      - connect
    confidence: 0.9

  - id: motor
    patternId: database_connection
    databaseType: mongodb
    importModules:
      - motor.motor_asyncio
      - motor.motor_tornado
      - pymongo
    callNames:
      - AsyncIOMotorClient
      - MongoClient
    confidence: 0.9

  - id: redis_py
    patternId: database_connection
    databaseType: redis
    importModules:
      - redis
      - aioredis
    callNames:
      - Redis
      - StrictRedis
      - from_url
      - asyncio.create_redis_pool
    confidence: 0.9

  - id: aiosqlite
    patternId: database_connection
    databaseType: sqlite
    importModules:
      - aiosqlite
      - sqlite3
    callNames:
      - connect
    confidence: 0.85

  - id: cassandra_driver_py
    patternId: database_connection
    databaseType: cassandra
    importModules:
      - cassandra.cluster
      - cassandra
    callNames:
      - Cluster
    confidence: 0.85

  - id: boto3_dynamodb
    patternId: database_connection
    databaseType: dynamodb
    importModules:
      - boto3
    callNames:
      - resource
      - client
    confidence: 0.8

  - id: elasticsearch_py
    patternId: database_connection
    databaseType: elasticsearch
    importModules:
      - elasticsearch
      - elasticsearch_async
    callNames:
      - Elasticsearch
      - AsyncElasticsearch
    confidence: 0.85

  - id: asyncpg
    patternId: database_connection
    databaseType: postgres
    importModules:
      - asyncpg
    callNames:
      - connect
      - create_pool
    confidence: 0.9

  - id: databases_py
    patternId: database_connection
    databaseType: sql
    importModules:
      - databases
    callNames:
      - Database
    confidence: 0.85

  - id: tortoise_orm
    patternId: database_connection
    databaseType: sql
    importModules:
      - tortoise
      - tortoise.contrib
    callNames:
      - Tortoise.init
      - register_tortoise
    confidence: 0.85

auth:
  jwt:
    patternId: auth_middleware
    importModules:
      - jwt
    contentRegexes:
      - "jwt\\.encode\\("
      - "jwt\\.decode\\("
    strategy: jwt
    confidence: 0.85

  decorators:
    - id: login_required
      patternId: auth_middleware
      callNames:
        - login_required
      confidence: 0.8
    - id: is_authenticated
      patternId: auth_middleware
      callNames:
        - IsAuthenticated
      confidence: 0.8

  libraries:
    - id: bearer_token_header
      patternId: auth_middleware
      contentRegexes:
        - 'Authorization["'']?\s*,?\s*["'']?\s*Bearer'
        - '"Authorization"'
        - "Authorization\\s*:\\s*['\"]Bearer"
      strategy: bearer_token
      confidence: 0.7

    - id: oauth2
      patternId: auth_middleware
      importModules:
        - oauthlib
        - authlib
        - google.oauth2
        - google_auth_oauthlib
      strategy: oauth2
      confidence: 0.85

routes:
  frameworks:
    - id: fastapi
      patternId: express_route
      importModules:
        - fastapi
      decoratorPrefixes:
        - app.get
        - app.post
        - app.put
        - app.delete
        - app.patch
      confidence: 0.9

    - id: flask
      patternId: express_route
      importModules:
        - flask
      decoratorPrefixes:
        - app.route
        - bp.route
        - blueprint.route
      confidence: 0.9

    - id: starlette
      patternId: express_route
      importModules:
        - starlette
      decoratorPrefixes:
        - app.route
      confidence: 0.85

    - id: bottle
      patternId: express_route
      importModules:
        - bottle
      decoratorNames:
        - route
        - get
        - post
        - put
        - delete
      confidence: 0.85

    - id: django_urls
      patternId: express_route
      importModules:
        - django.
      urlsFileSuffix: "urls.py"
      pathRegex: "(path|re_path|url)\\(\\s*['\\\"]([^'\\\"]+)['\\\"]"
      confidence: 0.9

    - id: grpc
      patternId: express_route
      importModules:
        - grpc
      pathRegex: "\\.add_(?:insecure_)?port\\s*\\(\\s*['\\\"]([^'\\\"]+)['\\\"]"
      confidence: 0.8

serverless:
  handlers:
    - id: aws_lambda
      patternId: lambda_handler
      importModules:
        - boto3
      functionNameRegexes:
        - "^def\\s+lambda_handler\\b"
        - "^def\\s+handler\\b"
      confidence: 0.9

    - id: azure_functions
      patternId: lambda_handler
      importModules:
        - azure.functions
      decoratorNames:
        - FunctionName
      confidence: 0.9

    - id: gcp_functions
      patternId: lambda_handler
      importModules:
        - functions_framework
      decoratorNames:
        - functions_framework.http
        - functions_framework.cloud_event
        - http
        - cloud_event
      confidence: 0.9

env_config:
  envVariable:
    patternId: env_variable
    regex: "os\\.(environ\\[['\\\"][^'\\\"]+['\\\"]\\]|getenv\\(\\s*['\\\"][^'\\\"]+['\\\"])"
    confidence: 0.85

  djangoSettings:
    patternId: config_file
    fileSuffix: "settings.py"
    name: django_settings
    confidence: 0.9

  dotenvConfig:
    patternId: config_file
    requiresOsImport: true
    contentSubstring: "load_dotenv("
    name: dotenv_config
    confidence: 0.85

external_apis:
  httpClients:
    - id: requests
      patternId: external_api_call
      clientName: requests
      importModules:
        - requests
      urlRegex: "['\\\"](https?:\\/\\/[^\\s'\\\"]+)['\\\"]"
      confidence: 0.85

    - id: httpx
      patternId: external_api_call
      clientName: httpx
      importModules:
        - httpx
      urlRegex: "['\\\"](https?:\\/\\/[^\\s'\\\"]+)['\\\"]"
      confidence: 0.85

    - id: aiohttp
      patternId: external_api_call
      clientName: aiohttp
      importModules:
        - aiohttp
      urlRegex: "['\\\"](https?:\\/\\/[^\\s'\\\"]+)['\\\"]"
      confidence: 0.85

    - id: supabase_python
      patternId: external_api_call
      clientName: supabase
      importModules:
        - supabase
      callNames:
        - create_client
      confidence: 0.85

    - id: grpc_dial
      patternId: external_api_call
      clientName: grpc
      importModules:
        - grpc
      callNames:
        - grpc.insecure_channel
        - grpc.secure_channel
        - insecure_channel
        - secure_channel
      urlRegex: "['\\\"]([^'\\\"]+)['\\\"]"
      confidence: 0.8

