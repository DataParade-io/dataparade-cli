# Terraform structural patterns (block syntax, references, type hints, satellites).
# All matching rules live here — analyzers compile these at load time.

version: 1

syntax:
  # Line must look like a top-level Terraform block before deeper regex checks.
  block_line_probe_regex: "^(?:resource|data|module|provider)\\s+"
  block_patterns:
    - kind: resource
      regex: '^resource\s+"([^"]+)"\s+"([^"]+)"\s*\{\s*$'
      resource_type_group: 1
      block_name_group: 2
    - kind: data
      regex: '^data\s+"([^"]+)"\s+"([^"]+)"\s*\{\s*$'
      resource_type_group: 1
      block_name_group: 2
    - kind: module
      regex: '^module\s+"([^"]+)"\s*\{\s*$'
      block_name_group: 1
    - kind: provider
      regex: '^provider\s+"([^"]+)"\s*\{\s*$'
      block_name_group: 1

# First-token skip list for generic reference extraction (HCL reserved / meta).
reserved_reference_first_tokens:
  - var
  - local
  - module
  - each
  - path
  - terraform
  - count

# Order: first matching regex wins for each body span (global iteration).
reference_patterns:
  - id: data_block_refs
    regex: "\\bdata\\.([a-z0-9_]+)\\.([a-z0-9_]+)\\b"
    flags: gi
    template: "data.$1.$2"
  - id: resource_and_intermediate_attr_refs
    regex: "\\b([a-z][a-z0-9_]*)\\.([a-z0-9_]+)(?:\\.[a-z0-9_]+)?\\b"
    flags: gi
    template: "$1.$2"
    skip_when_first_token_reserved: true

# Satellite resources attach to an existing primary resource (same file) and do not become separate nodes.
satellite_resource_rules:
  - id: s3_bucket_scoped_attachments
    child_resource_type_regex: '^aws_s3_bucket_(acl|ownership_controls|logging|versioning|public_access_block|server_side_encryption_configuration|lifecycle_configuration|replication_configuration|website|cors_configuration|policy|object_lock_configuration|notification)$'
    parent_address_from_body_line:
      regex: '^\s*bucket\s*=\s*((?:[a-z][a-z0-9_]*)\.([a-z0-9_]+))(?:\.[a-z0-9_.]+)?\s*$'
      capture_group: 1

