fallback_policy:
  nonConcreteSectionIds:
    - root
    - "<unsectioned>"
    - global
  actorTargetReverseConfidenceFloor: 0.8
  preferredApiSourceConfidenceFloor: 0.75
  crossSectionActorAssetFlowConfidence: 0.7
  rewriteThroughProviderFlowTypes:
    - database_query
    - api_call
  postgresLikeSignals:
    - postgres
    - pg
    - postgresql
  genericPgNodeNames:
    - pg
    - postgres
    - postgresql
  genericPgClientSignals:
    - pg
    - postgres
    - postgresql
    - node-postgres
    - psycopg
    - psycopg2
  implicitManagedPostgresNodeKeys:
    - postgres
  managedResourceMatchHintsByKind:
    database:
      - postgres
      - pg
      - mysql
      - mongo
      - sql
    cache:
      - redis
      - cache
      - kv

provider_topology_rules:
  - providerId: supabase
    providerDisplayName: Supabase
    canonicalServiceName: supabase
    allowManagedDatabaseSharedFileInference: true
    confidence:
      managedNodeMinConfidence: 0.78
      providerToManagedNodeFlowConfidence: 0.78
      providerToManagedResourceFlowConfidence: 0.75
      sourceToProviderFlowConfidenceFloor: 0.72
      rewiredFlowConfidenceFloor: 0.75
      collapseManagedPostgresFlowConfidence: 0.78
    providerMatchKeys:
      - supabase
      - "@supabase"
      - supabase-js
      - supabase-py
      - supabase_py
      - supabase.com
    managedResources:
      - kind: database
        matchHints:
          - postgres
          - pg
          - postgresql
          - supabase
        viaClients:
          - supabase
          - "@supabase"
          - "@supabase/supabase-js"
          - supabase-js
          - supabase/postgrest-js
          - postgrest
          - supabase db
          - supabase postgres
          - supabase sql
          - supabase connection
          - supabase pooler
        directClients:
          - pg
          - postgres
          - postgresql
          - postgres.js
          - drizzle
          - knex
          - prisma
          - kysely
          - sequelize
          - typeorm
      - kind: cache
        matchHints:
          - redis
          - cache
          - kv
        viaClients:
          - supabase
          - "@supabase"
          - "@supabase/supabase-js"
          - supabase realtime
          - supabase channels
          - supabase replication
          - supabase broadcast
          - supabase presence
          - supabase cache
          - supabase kv
          - upstash
        directClients:
          - redis
          - ioredis
          - "@upstash/redis"
    managedServiceNodes:
      - key: postgres
        label: Supabase Pg
        componentType: asset
        componentSubType: database
        flowType: database_query
        usageSignals:
          - database
          - database_connection
          - postgres
          - pg
          - sql
          - query
          - from
        evidencePatterns:
          - database_connection
      - key: auth
        label: Supabase Auth
        componentType: asset
        componentSubType: auth_service
        flowType: api_call
        usageSignals:
          - auth
          - signin
          - sign-in
          - signup
          - sign-up
          - session
          - jwt
          - user
        evidencePatterns:
          - auth_middleware
      - key: storage
        label: Supabase Storage
        componentType: asset
        componentSubType: file_storage
        flowType: file_transfer
        usageSignals:
          - storage
          - bucket
          - upload
          - file
          - object
