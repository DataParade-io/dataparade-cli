    confidence: 0.85
    url_host_patterns:
      - openrouter.ai
      - openrouter.com
  - serviceName: google_ai
    patternId: external_api_call
    importFragments:
      - '@google/genai'
      - '@google-ai/'
      - '@google-cloud/vertexai'
      - vertexai
    confidence: 0.85
    url_host_patterns:
      - generativelanguage.googleapis.com
      - aiplatform.googleapis.com
      - vertexai.googleapis.com
  - serviceName: aws
    patternId: external_api_call
    importFragments:
      - "@aws-sdk/"
      - boto3
      # .NET (`AWSSDK.S3`, `using Amazon.S3;`) and C++ (`<aws/s3/S3Client.h>`).
      - aws-sdk
      - awssdk
      - amazon.
      - aws/
    confidence: 0.85
    url_host_patterns:
      - amazonaws.com
      - aws.amazon.com
  - serviceName: auth0
    patternId: external_api_call
    importFragments:
      - "@auth0/"
      - "auth0"
    confidence: 0.85
    url_host_patterns:
      - auth0.com
      - auth0
  - serviceName: firebase
    patternId: external_api_call
