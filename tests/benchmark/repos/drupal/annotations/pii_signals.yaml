    start_line: 520
    end_line: 522
  expected:
    status: positive
    labels:
    - user_identifier
    exhaustive_scope_files:
    - core/modules/user/src/Entity/User.php
    - core/modules/user/src/UserAuthentication.php
    - core/modules/user/src/Authentication/Provider/Cookie.php
