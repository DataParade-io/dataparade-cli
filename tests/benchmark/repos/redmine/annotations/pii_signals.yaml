annotations:
- id: redmine-login-identifier-signal
  layer: pii_signals
  subject:
    key: pii:user_identifier
    name: login
  evidence:
    file_path: app/models/user.rb
    start_line: 126
    end_line: 127
  expected:
    status: positive
    labels:
    - user_identifier
    exhaustive_scope_files:
    - app/models/user.rb
    - app/models/email_address.rb
    - app/models/token.rb
    - app/models/auth_source.rb
    - app/models/auth_source_ldap.rb
    - app/models/principal.rb
    - config/database.yml.example
  rationale: validates_presence_of and validates_uniqueness_of :login mark login as the account identifier.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: proposed
