- id: redmine-login-to-check-password
  layer: data_flows
  subject:
    key: flow:login->check_password
    name: Login to check_password
  evidence:
    file_path: app/models/user.rb
    start_line: 231
    end_line: 241
  expected:
    status: positive
    labels:
    - data_flow
    exhaustive_scope_files:
    - app/models/user.rb
    - app/models/email_address.rb
