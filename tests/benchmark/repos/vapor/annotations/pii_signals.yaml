  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
- id: vapor-realm-not-pii
  layer: pii_signals
  subject:
    key: pii:email_address
    name: realm
  evidence:
    file_path: Sources/Vapor/Authentication/Authenticator.swift
    start_line: 66
    end_line: 67
  expected:
    status: negative
    labels: []
  rationale: The default BasicAuthenticator realm string is a static challenge label,
    not a personal identifier or email address.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
