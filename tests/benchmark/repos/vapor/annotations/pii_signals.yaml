annotations:
- id: vapor-username-signal
  layer: pii_signals
  subject:
    key: pii:user_identifier
    name: username
  evidence:
    file_path: Sources/Vapor/Authentication/BasicAuthorization.swift
    start_line: 10
    end_line: 11
  expected:
    status: positive
    labels:
    - user_identifier
    exhaustive_scope_files:
    - Sources/Vapor/Authentication/Authentication.swift
    - Sources/Vapor/Authentication/Authenticator.swift
    - Sources/Vapor/Authentication/BasicAuthorization.swift
    - Sources/Vapor/Authentication/BearerAuthorization.swift
    - Sources/Vapor/Authentication/GuardMiddleware.swift
    - Sources/Vapor/Authentication/RedirectMiddleware.swift
    - Sources/Vapor/Authentication/SessionAuthenticatable.swift
  rationale: BasicAuthorization.username is a live login identifier parsed from the
    Authorization header and may be an email address.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
- id: vapor-password-signal
  layer: pii_signals
  subject:
    key: pii:password
    name: password
  evidence:
    file_path: Sources/Vapor/Authentication/BasicAuthorization.swift
    start_line: 13
    end_line: 14
  expected:
    status: positive
    labels:
    - credential_secret
    exhaustive_scope_files:
    - Sources/Vapor/Authentication/Authentication.swift
    - Sources/Vapor/Authentication/Authenticator.swift
    - Sources/Vapor/Authentication/BasicAuthorization.swift
    - Sources/Vapor/Authentication/BearerAuthorization.swift
    - Sources/Vapor/Authentication/GuardMiddleware.swift
    - Sources/Vapor/Authentication/RedirectMiddleware.swift
    - Sources/Vapor/Authentication/SessionAuthenticatable.swift
  rationale: BasicAuthorization.password holds the plaintext credential decoded from
    the Basic auth header.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
- id: vapor-bearer-token-signal
  layer: pii_signals
  subject:
    key: pii:access_token
    name: token
  evidence:
    file_path: Sources/Vapor/Authentication/BearerAuthorization.swift
    start_line: 5
    end_line: 6
  expected:
    status: positive
    labels:
    - access_token
    exhaustive_scope_files:
    - Sources/Vapor/Authentication/Authentication.swift
    - Sources/Vapor/Authentication/Authenticator.swift
    - Sources/Vapor/Authentication/BasicAuthorization.swift
    - Sources/Vapor/Authentication/BearerAuthorization.swift
    - Sources/Vapor/Authentication/GuardMiddleware.swift
    - Sources/Vapor/Authentication/RedirectMiddleware.swift
    - Sources/Vapor/Authentication/SessionAuthenticatable.swift
  rationale: BearerAuthorization.token is the bearer secret extracted from the Authorization
