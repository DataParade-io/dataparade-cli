annotations:
- id: auth0-express-access-token-signal
  layer: pii_signals
  subject:
    key: pii:access_token
    name: access_token
  evidence:
    file_path: lib/context.js
    start_line: 270
    end_line: 270
  expected:
    status: positive
    labels:
    - access_token
    exhaustive_scope_files:
    - lib/appSession.js
    - lib/client.js
    - lib/config.js
    - lib/context.js
    - lib/cookies.js
    - lib/crypto.js
    - lib/debug.js
    - lib/errors.js
    - lib/hooks/backchannelLogout/isLoggedOut.js
    - lib/hooks/backchannelLogout/onLogIn.js
    - lib/hooks/backchannelLogout/onLogoutToken.js
    - lib/hooks/getLoginState.js
    - lib/once.js
    - lib/tokenset.js
    - lib/transientHandler.js
    - lib/utils/epoch.js
    - lib/utils/oidcError.js
    - lib/utils/promisifyCompat.js
    - lib/utils/sessionExpiry.js
    - lib/weakCache.js
  rationale: access_token from the refresh grant is written into the encrypted session
    and used for API access.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
- id: auth0-express-id-token-signal
  layer: pii_signals
  subject:
    key: pii:access_token
    name: id_token
  evidence:
    file_path: lib/context.js
    start_line: 1083
    end_line: 1083
  expected:
    status: ambiguous
    labels: []
  rationale: id_token is an OIDC identity JWT stored in the session after login; it
    is not a source-fixed API access_token.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
- id: auth0-express-sub-signal
  layer: pii_signals
  subject:
    key: pii:user_identifier
    name: sub
  evidence:
    file_path: lib/context.js
    start_line: 1120
    end_line: 1120
  expected:
    status: positive
    labels:
    - user_identifier
    exhaustive_scope_files:
    - lib/appSession.js
    - lib/client.js
    - lib/config.js
    - lib/context.js
    - lib/cookies.js
    - lib/crypto.js
    - lib/debug.js
    - lib/errors.js
    - lib/hooks/backchannelLogout/isLoggedOut.js
    - lib/hooks/backchannelLogout/onLogIn.js
    - lib/hooks/backchannelLogout/onLogoutToken.js
    - lib/hooks/getLoginState.js
    - lib/once.js
    - lib/tokenset.js
    - lib/transientHandler.js
    - lib/utils/epoch.js
    - lib/utils/oidcError.js
    - lib/utils/promisifyCompat.js
    - lib/utils/sessionExpiry.js
    - lib/weakCache.js
  rationale: claims.sub is the stable subject identifier used to detect same-user
    re-login versus account switch.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
- id: auth0-express-client-id-not-email
  layer: pii_signals
  subject:
    key: pii:email_address
    name: clientID
  evidence:
    file_path: lib/config.js
    start_line: 203
    end_line: 203
  expected:
    status: negative
    labels: []
  rationale: clientID is an OAuth application identifier, not an email address or
    other PII field.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
- id: auth0-express-refresh-token-item-pii-signal
  layer: pii_signals
  subject:
    key: pii:credential_secret
    name: refresh_token
  evidence:
    file_path: lib/context.js
    start_line: 274
    end_line: 274
  expected:
    status: positive
    labels:
    - credential_secret
    exhaustive_scope_files:
    - lib/appSession.js
    - lib/client.js
    - lib/config.js
    - lib/context.js
    - lib/cookies.js
    - lib/crypto.js
    - lib/debug.js
    - lib/errors.js
    - lib/hooks/backchannelLogout/isLoggedOut.js
    - lib/hooks/backchannelLogout/onLogIn.js
    - lib/hooks/backchannelLogout/onLogoutToken.js
    - lib/hooks/getLoginState.js
    - lib/once.js
    - lib/tokenset.js
    - lib/transientHandler.js
    - lib/utils/epoch.js
    - lib/utils/oidcError.js
    - lib/utils/promisifyCompat.js
    - lib/utils/sessionExpiry.js
    - lib/weakCache.js
  rationale: refresh_token is stored in the session and sent to the token endpoint
