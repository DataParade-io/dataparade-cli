    start_line: 52
    end_line: 73
  expected:
    status: positive
    labels:
    - data_flow
    exhaustive_scope_files:
    - src/Libraries/Nop.Core/Domain/Customers/Customer.cs
    - src/Libraries/Nop.Core/Domain/Customers/CustomerPassword.cs
    - src/Libraries/Nop.Core/Domain/Customers/ExternalAuthenticationRecord.cs
