annotations:
- id: wordpress-user-login-signal
  layer: pii_signals
  subject:
    key: pii:user_identifier
    name: user_login
  evidence:
    file_path: src/wp-includes/user.php
    start_line: 33
    end_line: 34
  expected:
    status: positive
    labels:
    - user_identifier
    exhaustive_scope_files:
    - src/wp-includes/user.php
    - src/wp-includes/class-wp-user.php
    - src/wp-includes/class-wpdb.php
    - src/wp-includes/pluggable.php
    - src/wp-includes/class-wp-session-tokens.php
    - src/wp-includes/class-wp-user-meta-session-tokens.php
    - src/wp-includes/cache.php
    - src/wp-includes/class-wp-object-cache.php
    - src/wp-includes/rest-api/endpoints/class-wp-rest-users-controller.php
  rationale: wp_signon credentials document user_login as the username used to authenticate.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: proposed
- id: wordpress-user-password-signal
  layer: pii_signals
  subject:
    key: pii:credential_secret
    name: user_password
  evidence:
    file_path: src/wp-includes/user.php
    start_line: 34
    end_line: 34
  expected:
    status: positive
    labels:
    - credential_secret
    exhaustive_scope_files:
    - src/wp-includes/user.php
    - src/wp-includes/class-wp-user.php
    - src/wp-includes/class-wpdb.php
    - src/wp-includes/pluggable.php
    - src/wp-includes/class-wp-session-tokens.php
    - src/wp-includes/class-wp-user-meta-session-tokens.php
    - src/wp-includes/cache.php
    - src/wp-includes/class-wp-object-cache.php
    - src/wp-includes/rest-api/endpoints/class-wp-rest-users-controller.php
  rationale: user_password in wp_signon credentials is the plaintext password submitted at login.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: proposed
