- id: wordpress-display-name-not-email
  layer: pii_signals
  subject:
    key: pii:email_address
    name: display_name
  evidence:
    file_path: src/wp-includes/class-wp-user.php
    start_line: 33
    end_line: 33
  expected:
    status: negative
    labels: []
  rationale: display_name is a public name string, not an email address field.
