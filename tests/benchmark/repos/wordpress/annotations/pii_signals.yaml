    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: proposed
- id: wordpress-user-pass-hash-not-plaintext
  layer: pii_signals
  subject:
    key: pii:credential_secret
    name: user_pass
  evidence:
    file_path: src/wp-includes/class-wp-user.php
    start_line: 14
    end_line: 15
  expected:
    status: negative
    labels: []
  rationale: The class docblock states user_pass is hashed with bcrypt by default, not stored as plaintext.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: proposed
