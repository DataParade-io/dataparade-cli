annotations:
- id: flask-login-user-id-from-mixin
  layer: data_items
  subject:
    key: data_item:id
    name: id
  evidence:
    file_path: src/flask_login/mixins.py
    start_line: 23
    end_line: 27
  expected:
    status: positive
    labels:
    - user_identifier
    exhaustive_scope_files:
    - src/flask_login/mixins.py
    - src/flask_login/login_manager.py
    - src/flask_login/config.py
  rationale: get_id serializes self.id as the stable user identifier Flask-Login stores
    in the session.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
