annotations:
- id: flask-login-user-id-signal
  layer: pii_signals
  subject:
    key: pii:user_identifier
    name: user_identifier
  evidence:
    file_path: src/flask_login/login_manager.py
    start_line: 321
    end_line: 321
  expected:
    status: positive
    labels:
    - user_identifier
    exhaustive_scope_files:
    - src/flask_login/mixins.py
    - src/flask_login/login_manager.py
    - src/flask_login/config.py
  rationale: session.get("_user_id") is a live identifier used to restore the authenticated
    user.
  provenance:
    proposed_by: composer-2.5-swarm
    proposed_at: 2026-08-30
    review_state: accepted
    reviewed_by: grok-4.6-refine
    reviewed_at: '2026-08-30'
